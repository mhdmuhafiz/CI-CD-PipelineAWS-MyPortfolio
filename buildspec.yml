version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Nothing to install for static site"

  pre_build:
    commands:
      - echo "Pre-build phase started"

  build:
    commands:
      - echo "Build phase started"
      - ls -la

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - index.html
    - style.css
    - script.js
  discard-paths: yes
